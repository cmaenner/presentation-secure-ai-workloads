# Default deny all traffic to the model server.
#
# Ybor production equivalent: setting istio_fail_closed=true on the
# PlatformApplication operator auto-generates both a NetworkPolicy
# (default-deny ingress) and an AuthorizationPolicy (ALLOW only for
# declared inbound.services principals via SPIFFE identity).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-model-server
  namespace: ai-demo
spec:
  endpointSelector:
    matchLabels:
      app: model-server
  ingress: []
  egress: []
