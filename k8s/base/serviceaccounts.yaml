# In Ybor's production platform, ServiceAccounts are auto-created by the
# PlatformApplication operator. Each app gets a dedicated SA with
# SPIFFE identity: cluster.local/ns/{namespace}/sa/{app-name}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-server
  namespace: ai-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trusted-client
  namespace: trusted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: untrusted-client
  namespace: untrusted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: attacker
  namespace: untrusted
