apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: ai-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
        security.ybor.ai/tier: sensitive
    spec:
      serviceAccountName: model-server
      containers:
        - name: model-server
          image: model-server:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_NAME
              value: demo-llm-v1
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
