# Cilium configuration for kind cluster
# kubeProxyReplacement is required when kubeProxyMode: "none" in kind config
kubeProxyReplacement: true

# Required for kind compatibility — restricts socket LB to host namespace
socketLB:
  hostNamespaceOnly: true

ipam:
  mode: kubernetes

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

operator:
  replicas: 1

# k8sServiceHost and k8sServicePort are set via --set at install time
# to match the cluster name (e.g., insecure-demo-control-plane)
